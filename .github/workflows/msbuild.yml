name: Preservation build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install own-key credential test dependency
        shell: pwsh
        run: python -m pip install cryptography
      - name: Build source and run synthetic regression suite
        shell: pwsh
        run: ./scripts/Build.ps1 -BuildRoot "$env:RUNNER_TEMP/ow1-build"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: ${{ runner.temp }}/ow1-build/*.log
